name: CI — mcp-floorplans

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check formatting with black
        run: |
          pip install black
          black --check --diff . --exclude venv

      - name: Run tests with pytest
        run: |
          pytest test_space_calculator.py -v

      - name: Run MCP server startup test
        run: |
          python -c "
import subprocess
import sys
import time

# Start MCP server
proc = subprocess.Popen(['python', 'server.py'],
                       stdout=subprocess.PIPE, stderr=subprocess.PIPE)
time.sleep(1)

# Send EOF to gracefully shutdown
proc.terminate()
rc = proc.wait(timeout=5)
print(f'✓ MCP server started and shut down gracefully (exit code: {rc})')
"
